name: corestream_mobile
description: App móvil de CoreStream — seguimiento de proyectos, tickets, incidencias y notificaciones.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Gestión de estado
  flutter_riverpod: ^2.5.1
  # Cliente HTTP para el backend FastAPI (modo API real)
  dio: ^5.4.3
  # Persistencia ligera de preferencias (tema, idioma, modo)
  shared_preferences: ^2.2.3
  # Persistencia PostgreSQL para la demostración académica de Ficha Avance 02
  supabase_flutter: ^2.17.2

  # Push reales (desactivado por defecto; ver lib/services/push_service.dart
  # y README «Activar Firebase»). Descomentar al ejecutar `flutterfire configure`:
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
